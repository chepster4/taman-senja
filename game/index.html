<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taman Senja — Cari Perbedaannya</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #171226; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: 1280px; height: 720px; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Taman Senja: cari tujuh perbedaan di antara dua gambar di setiap taman"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
